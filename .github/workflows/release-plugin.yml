name: Release Plugin Zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-plugin-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build plugin zip
        run: |
          # Create zip with plugin.json files at standard paths
          zip -r secure-agent-playbook.zip \
            .claude-plugin/ \
            plugins/ \
            CLAUDE.md \
            plays/ \
            data/ \
            templates/ \
            template/ \
            -x '*.git*'

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            secure-agent-playbook.zip \
            --clobber
